name: Prova e aggiorna EDITH

on:
  push:
    branches: [main]
    paths: ['apps-script/**', 'index.html', 'tests/**', '.github/workflows/edith.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edith-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test sui casi reali
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js

  deploy:
    name: Aggiorna lo script e il deployment Voce
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla i segreti
        id: segreti
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Aggiornamento automatico non ancora attivo: mancano i segreti CLASPRC_JSON, SCRIPT_ID o DEPLOYMENT_ID (vedi apps-script/AUTOMATICO.md)."
            echo "pronto=no" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepara i file
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          if [ -n "$SHEET_ID" ]; then
            sed -i "s/SHEET_ID: ''/SHEET_ID: '$SHEET_ID'/" apps-script/src/00_Config.gs
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > apps-script/.clasp.json
      - name: Carica il codice su Apps Script
        if: steps.segreti.outputs.pronto == 'si'
        working-directory: apps-script
        run: npx -y @google/clasp@3.4.1 push -f
      - name: Nuova versione del deployment Voce
        if: steps.segreti.outputs.pronto == 'si'
        working-directory: apps-script
        run: npx -y @google/clasp@3.4.1 update-deployment "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"
      - name: Pulizia
        if: always()
        run: rm -f ~/.clasprc.json apps-script/.clasp.json
