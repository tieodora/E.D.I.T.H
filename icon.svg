<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ff6ff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#00c8ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" filter="url(#neon)">
    <!-- anello esterno a segmenti -->
    <circle cx="256" cy="256" r="200" stroke="#25d9ff" stroke-width="10" stroke-dasharray="70 18" opacity=".9" transform="rotate(-12 256 256)"/>
    <!-- tacche sottili -->
    <circle cx="256" cy="256" r="178" stroke="#7ff6ff" stroke-width="4" stroke-dasharray="3 11" opacity=".7"/>
    <!-- arco oro -->
    <path d="M 256 98 A 158 158 0 0 1 405 205" stroke="#ffb627" stroke-width="9"/>
    <!-- arco rosso -->
    <path d="M 107 307 A 158 158 0 0 1 98 240" stroke="#ff3b3b" stroke-width="9"/>
    <!-- anello interno -->
    <circle cx="256" cy="256" r="128" stroke="#25d9ff" stroke-width="6" opacity=".95"/>
  </g>
  <!-- E stilizzata -->
  <g filter="url(#neon)" fill="#e9fdff">
    <rect x="200" y="186" width="20" height="140" rx="4"/>
    <rect x="200" y="186" width="112" height="20" rx="4"/>
    <rect x="200" y="246" width="88" height="20" rx="4"/>
    <rect x="200" y="306" width="112" height="20" rx="4"/>
  </g>
  <circle cx="324" cy="256" r="9" fill="#ffb627" filter="url(#neon)"/>
</svg>
